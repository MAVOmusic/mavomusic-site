<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="assets/icon-horns.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slow Drip - MAVOmusic</title>
  <style>
    :root {
      --bg: #040807;
      --line: rgba(107, 255, 220, 0.55);
      --line-dim: rgba(107, 255, 220, 0.22);
      --text: #dfffF6;
      --muted: rgba(223, 255, 246, 0.72);
      --accent: #6bffdc;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: linear-gradient(rgba(6,3,2,0.82), rgba(6,3,2,0.93)), url("assets/bg-stairway.jpg") center / cover no-repeat fixed, var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10; background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.022) 0, rgba(255,255,255,0.022) 1px, transparent 1px, transparent 4px); mix-blend-mode: screen; opacity: 0.5; }
    #playerWrap { position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(24, 145, 121, 0.16), transparent 45%), #020303; }
    #playerWrap iframe, #player { width: 100%; height: 100%; border: 0; display: block; }
    .hud { position: fixed; left: 10px; top: 10px; z-index: 25; display: flex; align-items: center; gap: 8px; max-width: calc(100vw - 360px); padding: 6px 10px; border: 1px solid var(--line-dim); border-radius: 999px; background: rgba(0,0,0,0.72); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 1.2s infinite; }
    #controls { position: fixed; right: 10px; top: 10px; z-index: 25; display: flex; gap: 8px; }
    .pill { cursor: pointer; padding: 6px 10px; border: 1px solid var(--line-dim); border-radius: 999px; background: rgba(0,0,0,0.72); color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
    .pill:hover { color: var(--text); border-color: var(--line); }
    #nextUp { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 20; max-width: 90vw; padding: 7px 11px; border: 1px solid var(--line-dim); border-radius: 999px; background: rgba(0,0,0,0.74); color: var(--muted); font-size: 12px; letter-spacing: 0.05em; text-align: center; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .overlay { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; background: radial-gradient(circle at center, rgba(24,145,121,0.2), transparent 55%), rgba(2,3,3,0.94); }
    .hidden { display: none !important; }
    .kicker { letter-spacing: 0.35em; text-transform: uppercase; color: var(--muted); font-size: clamp(10px, 1.4vw, 14px); }
    .title { font-size: clamp(16px, 3vw, 30px); max-width: 82vw; text-shadow: 0 0 14px rgba(107,255,220,0.45); }
    .big { font-size: clamp(48px, 12vw, 150px); font-weight: 800; line-height: 1; color: var(--accent); text-shadow: 0 0 30px rgba(107,255,220,0.65); font-family: Consolas, Monaco, monospace; }
    .cta { cursor: pointer; border: 1px solid var(--line); background: rgba(107,255,220,0.12); color: var(--text); padding: 14px 28px; border-radius: 8px; font-size: clamp(14px,2vw,20px); letter-spacing: 0.12em; text-transform: uppercase; }
    .cta:hover { background: rgba(107,255,220,0.3); }
    .dim { color: var(--muted); font-size: 13px; max-width: 70vw; }
    @keyframes blink { 0%,45% { opacity: 1; } 46%,100% { opacity: 0.3; } }
  
    /* ---- Bass cursor + dual neon slap waves (green/blue) ---- */
    html, body, a, button, .pill, .cta { cursor: url("assets/bass-cursor.png") 23 0, auto; }
    .slap { position: fixed; z-index: 99999; width: 14px; height: 14px; margin: -7px 0 0 -7px;
      border: 2px solid var(--slap, #39ff14); border-radius: 50%;
      box-shadow: 0 0 14px var(--slap, #39ff14), inset 0 0 8px var(--slap, #39ff14);
      pointer-events: none; animation: slapwave var(--dur, 0.7s) ease-out forwards; }
    @keyframes slapwave {
      to { width: var(--end, 90px); height: var(--end, 90px);
        margin: calc(var(--end, 90px) / -2) 0 0 calc(var(--end, 90px) / -2);
        transform: translateY(calc(var(--rise, 40px) * -1)); opacity: 0; border-width: 1px; } }

  
  </style>
</head>
<body>
  <div id="playerWrap"><div id="player"></div></div>

  <div id="hud" class="hud hidden"><span class="dot"></span><span id="hudText"></span></div>

  <div id="controls">
    <button id="skipWaitBtn" class="pill hidden" title="Skip the wait and play now">Play now ⏭</button>
    <button id="fsBtn" class="pill" title="Real fullscreen (or press F)">Fullscreen ⛶</button>
    <a class="pill" href="/" target="_top" title="Back to the launcher">☰ Station</a>
  </div>

  <div id="nextUp" class="hidden"></div>

  <div id="startOverlay" class="overlay hidden">
    <div class="kicker">YouTube Drip Feed</div>
    <div id="startTitle" class="title"></div>
    <button id="startBtn" class="cta">💧 Start the drip</button>
    <div class="dim">One click for sound. The drip then plays ONE video, waits a while like a person would, plays the next - a slow, natural marathon. Press F for real fullscreen.</div>
  </div>

  <div id="waitOverlay" class="overlay hidden">
    <div class="kicker" id="waitKicker">Next drip at 14:32</div>
    <div id="waitTitle" class="title"></div>
    <div id="waitClock" class="big">60:00</div>
    <button id="playNowBtn" class="cta">▶ Play it now</button>
    <div class="dim">Leave the tab open - it drips on its own.</div>
  </div>

  <div id="errorOverlay" class="overlay hidden">
    <div class="kicker" id="errKicker">Video unavailable</div>
    <div class="dim">Skipping to the next drip…</div>
  </div>

  <script src="https://mavomusic.github.io/mavomusic-site/playlists.js"></script>
  <script>
    // V2.4: playlists load from GitHub Pages (edit songs online, no uploads).
    // If that file is missing, has a typo, or the net is down, the packaged
    // copy below loads instead - the station never breaks.
    window.MAVO_LONGS && window.MAVO_SHORTS ||
      document.write('<script src="playlists.js">\x3C/script>');
  </script>
  <script>
    /*****************************************************************
     * EDIT HERE - full links or just IDs, as many as you like.
     *****************************************************************/
    // The list lives in playlists.js (same folder). EDIT THERE.
    const videos = (window.MAVO_LONGS || []).slice();
    // V2.0: every visit deals a fresh shuffled queue - never the same running order twice.
    for (let i = videos.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = videos[i]; videos[i] = videos[j]; videos[j] = t; }

    // Minutes between one video ending and the next one starting.
    const minutesBetweenDrips = 60;

    // true = after the last video, loop the list forever. false = stop.
    const endlessDrip = true;

    /*****************************************************************/
    const $ = (id) => document.getElementById(id);
    let currentIndex = 0, dripCount = 0, player = null, gotPlaying = false, ytReady = false;
    let waitTimer = null, waitTarget = 0;

    function extractVideoId(value) {
      const raw = String(value || "").trim();
      if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
      try {
        const url = new URL(raw);
        if (url.hostname.includes("youtu.be")) return url.pathname.split("/").filter(Boolean)[0] || raw;
        const vParam = url.searchParams.get("v");
        if (vParam) return vParam;
        const match = url.pathname.match(/\/(embed|shorts|live)\/([A-Za-z0-9_-]{11})/);
        if (match) return match[2];
      } catch (err) {}
      const loose = raw.match(/([A-Za-z0-9_-]{11})/);
      return loose ? loose[1] : raw;
    }
    videos.forEach((v) => { v.id = extractVideoId(v.url || v.id); });

    function pad(n) { return String(n).padStart(2, "0"); }
    function show(el) { el.classList.remove("hidden"); }
    function hide(el) { el.classList.add("hidden"); }
    function hideAllOverlays() { hide($("startOverlay")); hide($("waitOverlay")); hide($("errorOverlay")); }
    function clearWait() { if (waitTimer) { clearInterval(waitTimer); waitTimer = null; } }

    function clockLabel(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

    function updateHud() {
      show($("hud"));
      $("hudText").textContent = `DRIP ${dripCount} · VIDEO ${currentIndex + 1}/${videos.length} // ${videos[currentIndex].title}`;
    }

    function createPlayer(videoId) {
      player = new YT.Player("player", {
        width: "100%", height: "100%", videoId: videoId,
        playerVars: { autoplay: 1, controls: 1, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3 },
        events: { onReady: (e) => e.target.playVideo(), onStateChange: onState, onError: onErr }
      });
    }

    function startVideo(index) {
      currentIndex = index;
      dripCount++;
      clearWait();
      hideAllOverlays();
      hide($("skipWaitBtn"));
      updateHud();
      gotPlaying = false;
      const video = videos[index];
      if (player && typeof player.loadVideoById === "function") player.loadVideoById(video.id);
      else createPlayer(video.id);
      setTimeout(() => {
        if (!gotPlaying) {
          $("startTitle").textContent = `Your browser paused autoplay. Click below to play: ${videos[index].title}`;
          show($("startOverlay"));
        }
      }, 6000);
    }

    function onState(e) {
      if (e.data === YT.PlayerState.PLAYING) { gotPlaying = true; hide($("startOverlay")); }
      if (e.data === YT.PlayerState.ENDED) scheduleNextDrip();
    }

    function onErr(e) {
      gotPlaying = true;
      $("errKicker").textContent = `Can't play that one (YouTube error ${e.data})`;
      show($("errorOverlay"));
      setTimeout(scheduleNextDrip, 4000);
    }

    function scheduleNextDrip() {
      let next = currentIndex + 1;
      if (next >= videos.length) {
        if (!endlessDrip) {
          hideAllOverlays(); hide($("nextUp"));
          $("waitKicker").textContent = `The drip is done - ${dripCount} videos played`;
          $("waitTitle").textContent = "Add more links and save, then reload this page.";
          $("waitClock").textContent = "-";
          $("playNowBtn").style.display = "none";
          show($("waitOverlay"));
          return;
        }
        next = 0;
      }
      waitTarget = Date.now() + minutesBetweenDrips * 60000;
      const at = new Date(waitTarget);
      $("waitKicker").textContent = `Next drip at ${clockLabel(at)}`;
      $("waitTitle").textContent = videos[next].title;
      $("playNowBtn").style.display = "";
      show($("waitOverlay"));
      show($("skipWaitBtn"));
      hide($("nextUp"));

      const render = () => {
        const remaining = Math.max(0, waitTarget - Date.now());
        const totalSec = Math.ceil(remaining / 1000);
        const mm = Math.floor(totalSec / 60);
        const ss = totalSec % 60;
        $("waitClock").textContent = `${pad(mm)}:${pad(ss)}`;
        if (remaining <= 0) { clearWait(); startVideo(next); }
      };
      render();
      waitTimer = setInterval(render, 250);

      // remember where the next drip lands for the skip button
      pendingNext = next;
    }

    let pendingNext = 0;

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    }

    $("startBtn").addEventListener("click", () => { hide($("startOverlay")); startVideo(currentIndex); });
    $("playNowBtn").addEventListener("click", () => startVideo(pendingNext));
    $("skipWaitBtn").addEventListener("click", () => startVideo(pendingNext));
    $("fsBtn").addEventListener("click", toggleFullscreen);
    document.addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") toggleFullscreen(); });

    window.onYouTubeIframeAPIReady = function () { ytReady = true; };
    const apiTag = document.createElement("script");
    apiTag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(apiTag);

    (function boot() {
      if (videos.length === 0) {
        $("startTitle").textContent = "The drip is empty - add some YouTube links in playlists.js.";
        $("startBtn").style.display = "none";
      } else {
        $("startTitle").textContent = `${videos.length} videos queued - one video every ${minutesBetweenDrips} minutes, all day.`;
      }
      show($("startOverlay"));
    })();
  </script>
  <script>
    // YouTube blocks embeds that have no web origin (opened as a file) - "Error 153".
    // Serve this page over http://localhost instead - run Localhost.ps1 in this folder.
    if (location.protocol === "file:") {
      const page = location.pathname.split("/").pop();
      const warn = document.createElement("div");
      warn.style.cssText = "position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:99999;max-width:92vw;padding:10px 16px;border-radius:10px;text-align:center;background:rgba(58,13,19,0.95);color:#ffb3bd;border:1px solid #ff4d6d;font:13px Arial,sans-serif;line-height:1.5";
      warn.innerHTML = "⚠ <b>Error 153 happens because this file was opened directly (file://).</b><br>Run <b>Localhost.ps1</b> in this folder, then open <b>http://localhost:8000/" + page + "</b> instead.";
      document.body.appendChild(warn);
    }
  </script>

  <script>
    // Dual neon slap waves (green + blue) - random sizes, drifting upwards like sound.
    document.addEventListener("pointerdown", function (e) {
      const NEON = ["#39ff14", "#00cfff"];
      for (let i = 0; i < 2; i++) {
        const s = document.createElement("span");
        s.className = "slap";
        s.style.left = e.clientX + "px";
        s.style.top = e.clientY + "px";
        s.style.setProperty("--slap", NEON[i % NEON.length]);
        s.style.setProperty("--end", Math.round(60 + Math.random() * 110) + "px");
        s.style.setProperty("--rise", Math.round(15 + Math.random() * 60) + "px");
        s.style.setProperty("--dur", (0.55 + Math.random() * 0.35).toFixed(2) + "s");
        s.style.animationDelay = (i * 0.07).toFixed(2) + "s";
        document.body.appendChild(s);
        setTimeout(function () { s.remove(); }, 1400);
      }
    });
  </script>
</body>
</html>
